# home.html

```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Performance Predictor</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background: #f4f4f4;
        }

        .container{
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-box{
            width: 500px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        h1{
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group{
            margin-bottom: 15px;
        }

        label{
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,select{
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button{
            width: 100%;
            padding: 12px;
            border: none;
            background: #007bff;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background: #0056b3;
        }

        .result{
            margin-top: 20px;
            text-align: center;
            font-size: 20px;
            color: green;
            font-weight: bold;
        }

    </style>
</head>
<body>

    <div class="container">

        <div class="form-box">

            <h1>Student Exam Performance Indicator</h1>

            <form action="/predictdata" method="post">

                <div class="form-group">
                    <label>Gender</label>
                    <select name="gender" required>
                        <option selected disabled value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Race or Ethnicity</label>
                    <select name="race_ethnicity" required>
                        <option selected disabled value="">Select Option</option>
                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Parental Level of Education</label>
                    <select name="parental_level_of_education" required>
                        <option selected disabled value="">Select Parent Education</option>
                        <option value="associate's degree">Associate's Degree</option>
                        <option value="bachelor's degree">Bachelor's Degree</option>
                        <option value="high school">High School</option>
                        <option value="master's degree">Master's Degree</option>
                        <option value="some college">Some College</option>
                        <option value="some high school">Some High School</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Lunch Type</label>
                    <select name="lunch" required>
                        <option selected disabled value="">Select Lunch Type</option>
                        <option value="standard">Standard</option>
                        <option value="free/reduced">Free/Reduced</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Test Preparation Course</label>
                    <select name="test_preparation_course" required>
                        <option selected disabled value="">Select Test Course</option>
                        <option value="none">None</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Reading Score out of 100</label>
                    <input type="number" name="reading_score" placeholder="Enter Reading Score" required>
                </div>

                <div class="form-group">
                    <label>Writing Score out of 100</label>
                    <input type="number" name="writing_score" placeholder="Enter Writing Score" required>
                </div>

                <button type="submit">Predict Math Score</button>

            </form>

            <div class="result">
                {{results}}
            </div>

        </div>

    </div>

</body>
</html>
```

Save this file inside:

```text
templates/home.html
```

Run Flask app and open:

```text
http://127.0.0.1:5000
```
